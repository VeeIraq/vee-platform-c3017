<!--
  Vee original product artwork — Custom NFC Card.
  House-style vector illustration (matches acrylic-stand / flat-tag / tissue-box).
-->
<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nfcCustomTitle">
  <title id="nfcCustomTitle">Custom Vee NFC card mockup</title>
  <defs>
    <linearGradient id="ag5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A3A28"/>
      <stop offset="1" stop-color="#C39A6B"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="300" rx="130" ry="16" fill="#EFE4D2"/>
  <rect x="80" y="150" width="240" height="150" rx="16" fill="#FCFAF5" stroke="#E4D7BE" stroke-width="2"/>
  <rect x="104" y="174" width="34" height="24" rx="4" fill="url(#ag5)"/>
  <path d="M124 250h150M124 266h110" stroke="#A99A82" stroke-width="4" stroke-linecap="round"/>
