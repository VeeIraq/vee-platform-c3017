<!--
  Vee hero illustration (abstract NFC tap scene) — Vee "Desert" brand colors.
  REPLACE ME: swap this file for a real product photo of your NFC stand
  on a restaurant/café table (same filename: hero-tap.svg, or update the
  <img src> in index.html to a .jpg/.png of your choice).
-->
<svg viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTapTitle">
  <title id="heroTapTitle">Vee NFC stand on a café table, phone tapping to open a digital business profile</title>
  <defs>
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A3A28"/>
      <stop offset="1" stop-color="#C39A6B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#C39A6B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C39A6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A332B"/>
      <stop offset="1" stop-color="#201B16"/>
    </linearGradient>
  </defs>

  <circle cx="320" cy="430" r="230" fill="url(#glow)"/>

  <!-- table surface -->
  <ellipse cx="320" cy="560" rx="260" ry="34" fill="#17130F"/>
  <ellipse cx="320" cy="552" rx="260" ry="34" fill="#241F1B"/>

  <!-- tap waves -->
  <g stroke="url(#gradAccent)" stroke-opacity="0.55" fill="none" stroke-width="1.5">
    <circle cx="320" cy="430" r="70" class="wave wave-1"/>
    <circle cx="320" cy="430" r="105" class="wave wave-2"/>
    <circle cx="320" cy="430" r="140" class="wave wave-3"/>
  </g>

  <!-- acrylic stand -->
  <g>
    <rect x="270" y="392" width="100" height="130" rx="14" fill="#241F1B" stroke="#4A4038" stroke-width="1.5"/>
    <rect x="284" y="408" width="72" height="72" rx="10" fill="url(#gradAccent)" fill-opacity="0.16"/>
    <path d="M310 436h28M310 448h28M310 460h18" stroke="#D9C9AE" stroke-width="3" stroke-linecap="round"/>
    <rect x="284" y="494" width="72" height="18" rx="6" fill="#1A1613" stroke="#4A4038"/>
    <text x="320" y="507" font-family="Arial, sans-serif" font-size="11" fill="#B8A98F" text-anchor="middle" letter-spacing="1">VEE 04</text>
  </g>

  <!-- phone tapping -->
  <g transform="rotate(-10 300 300)">
    <rect x="245" y="205" width="140" height="255" rx="26" fill="url(#phoneBody)" stroke="#4A4038" stroke-width="1.5"/>
    <rect x="257" y="222" width="116" height="188" rx="10" fill="#171310"/>
    <rect x="257" y="222" width="116" height="188" rx="10" fill="url(#gradAccent)" fill-opacity="0.12"/>
    <circle cx="315" cy="440" r="4" fill="#5C5347"/>
  </g>

  <!-- NFC badge glyph on stand -->
  <g transform="translate(300,378)">
    <circle cx="0" cy="0" r="30" fill="url(#gradAccent)"/>
    <path d="M-10 -10h20v20h-20z" fill="none" stroke="#EFE0C4" stroke-width="2.4"/>
    <path d="M-3 -4c2 2 2 6 0 8" fill="none" stroke="#EFE0C4" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
