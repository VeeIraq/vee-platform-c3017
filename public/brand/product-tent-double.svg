<!--
  Vee original product artwork — Double-Sided Tent NFC Stand.
  House-style vector illustration (matches acrylic-stand / flat-tag / tissue-box).
-->
<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tentTitle">
  <title id="tentTitle">Double-sided tent NFC table stand mockup</title>
  <defs>
    <linearGradient id="ag8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A3A28"/>
      <stop offset="1" stop-color="#C39A6B"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="300" rx="128" ry="16" fill="#EFE4D2"/>
  <!-- back panel (receding, second side) -->
  <rect x="88" y="150" width="112" height="145" rx="10" fill="#F5EBDA" stroke="#E4D7BE" stroke-width="2" transform="rotate(-28 200 150)"/>
  <g transform="rotate(-28 200 150)">
    <circle cx="144" cy="190" r="13" fill="url(#ag8)" opacity="0.55"/>
  </g>
  <!-- front panel (primary face, full content) -->
  <rect x="200" y="150" width="112" height="145" rx="10" fill="#FCFAF5" stroke="#E4D7BE" stroke-width="2" transform="rotate(28 200 150)"/>
  <g transform="rotate(28 200 150)">
    <text x="220" y="196" font-family="Arial, sans-serif" font-size="15" fill="#7A3A28" font-weight="bold" letter-spacing="1">VEE</text>
    <path d="M220 216h64M220 230h44" stroke="#A99A82" stroke-width="4" stroke-linecap="round"/>
    <rect x="220" y="252" width="70" height="22" rx="7" fill="#241F1B"/>
    <text x="255" y="267" font-family="Arial, sans-serif" font-size="10" fill="#FCFAF5" text-anchor="middle" letter-spacing="1.2">TABLE 3</text>
  </g>
  <!-- ridge NFC badge, sits on the fold line so it reads from either side -->
  <g transform="translate(200,150)">
    <circle r="21" fill="url(#ag8)"/>
    <path d="M-6 -6h12v12h-12z" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M-1.5 -2.5c1.4 1.4 1.4 3.6 0 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="200" y="336" font-family="Arial, sans-serif" font-size="11" fill="#8A7B68" text-anchor="middle" letter-spacing="2">TAP EITHER SIDE</text>
</svg>
